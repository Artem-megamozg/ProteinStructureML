baseline:
  name: "mlp"

  input_dim: 0
  hidden_dims:
    - 256
    - 512
    - 256

  output_dim: 0

  activation: "gelu"
  dropout: 0.2

training:
  loss: "mse"
  optimizer: "adamw"

  learning_rate: 0.001
  weight_decay: 0.0001

  scheduler:
    enabled: true
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 5
    min_lr: 0.000001

  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001